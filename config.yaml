# ---------------------------------------------------------------
# Job scanner settings. Edit these, commit, and the next run uses them.
# ---------------------------------------------------------------

# Only report jobs first posted within this many hours.
lookback_hours: 30

# Minimum resume-match score (0-100) to include a job in the digest.
min_match: 70

# Also list jobs scoring between this and min_match in a "close" section.
near_miss_min: 60

# Skip jobs whose description requires more years than this.
max_years_required: 6

# Strict mode: drop jobs whose core skills are in a field that isn't on your resume
# (full-stack/React, DBA, Power BI/Fabric, voice/telephony, cloud infra, security, ...).
strict_domain: true

# Job title must match at least one of these (case-insensitive regex).
title_include:
  - '\bai\b.*\bengineer'
  - '\bml\b.*\bengineer'
  - 'ai/ml'
  - 'machine learning'
  - '\bmlops\b'
  - '\bllm\b'
  - 'gen(erative)?\s?ai'
  - 'applied ai'
  - 'agent(ic)?\b.*engineer'
  - 'forward deployed.*(ai|engineer)'
  - '\bnlp\b.*engineer'
  - 'artificial intelligence'

# Skip titles containing any of these (seniority and off-target roles).
title_exclude:
  - '\bsenior\b'
  - '\bsr\.?\b'
  - '\bstaff\b'
  - '\bprincipal\b'
  - '\blead\b'
  - '\bmanager\b'
  - '\bdirector\b'
  - '\bhead of\b'
  - '\bvp\b'
  - 'vice president'
  - '\bchief\b'
  - '\barchitect\b'
  - '\bintern(ship)?s?\b'
  - 'new[- ]?grad'
  - '\bgraduate\b'
  - '\bco-?op\b'
  - '\bstudent\b'
  - '20\d\d start'
  - 'early[- ]career'
  - 'entry[- ]level'
  - '\bapprentice'
  - '\bfellow(ship)?\b'
  - '\bresiden(t|cy)\b'
  - '\bjunior\b'
  - '\bnetwork(ing)?\b'
  - 'data center'
  - '\baiops\b'
  - '\bsecurity\b'
  - 'cyber'
  - '\bdevops\b'
  - 'site reliability'
  - '\bsre\b'
  - '\bresearch scientist\b'
  - '\bscientist\b'
  - '\bprofessor\b'
  - 'robotics'
  - 'computer vision'
  - 'perception'
  - 'hardware'
  - 'firmware'
  - '\bsales\b'
  - 'account executive'
  - 'recruit'
  - 'product manager'
  - 'product marketing'
  - 'trainer'
  - 'tutor'
  - 'annotat'
  - '\bIV\b'
  - 'full[- ]?stack'
  - 'front[- ]?end'
  - '\bdba\b'
  - 'database administrator'
  - 'freelance'
  - 'part[- ]time'
  - '\bconsultant\b'
  - '\bspecialist\b'
  - '\(m/w/d\)'
  - '\(w/m/x\)'
  - '\(f/m/d\)'
  - '\(h/f\)'

# Companies to skip (current/past employers, already applied, etc.).
exclude_companies:
  - amazon
  - aws
  - jpmorgan
  - jp morgan
  - chase
  - usaa

# Location must look like the US (or US-remote). Extra US places you care about:
us_places:
  - dallas
  - plano
  - austin
  - houston
  - irving
  - frisco

# Optional: LLM scoring (much better match %). Set the ANTHROPIC_API_KEY secret
# in GitHub to enable. Only the top candidates are sent, so cost stays low.
llm:
  enabled: true
  model: claude-haiku-5-5
  max_jobs_per_run: 60
  # Only jobs with a keyword score at or above this get LLM-scored.
  prefilter_min: 50

# Job boards that list jobs from many companies (catches companies not in companies/*.txt).
job_boards:
  enabled: true
  linkedin:            # free, every scan (LinkedIn's public job search, no login)
    enabled: true
    pages: 6           # 10 jobs per page per search
    queries:
      - AI engineer
      - machine learning engineer
      - ML engineer
      - LLM engineer
      - generative AI engineer
      - applied AI engineer
      - MLOps engineer
      - AI forward deployed engineer
  apify:               # Built In, Hiring Cafe, Jobright via Apify; needs the APIFY_TOKEN secret
    enabled: true
    run_hours_utc: [15, 16]     # once a day: the 9:00 AM Central scan
    monthly_budget_usd: 4.5     # skip Apify once this month's usage reaches this (free credit is $5)
    per_actor_max_usd: 0.06     # hard cost cap per Actor run
    posted_within_days: 1
    builtin_queries: [machine learning engineer]
    hiringcafe_keyword: machine learning engineer
    hiringcafe_max: 30
    jobright_queries: [AI engineer, machine learning engineer]
    jobright_max: 20

# Sources to scan. Core platforms (fast, API-based):
sources:
  greenhouse: true
  lever: true
  ashby: true
  smartrecruiters: true
  workday: true
  # Careers systems behind many companies' own-branded careers sites:
  icims: true
  taleo: true
  successfactors: true
  oracle: true
  phenom: true
  eightfold: true        # e.g. Microsoft, PayPal
  avature: true
  bamboohr: true
  workable: true
  paycom: true
  jazzhr: true
  rippling: true
  breezy: true
  recruitee: true
  cornerstone: true
  gem: true
  pinpoint: true
  dayforce: true
  adp: true
  recruiterbox: true
  ukg: true
  paylocity: true
  jobvite: true
  # Big companies with their own careers systems:
  first_party: true
  # Any other careers site you list in companies/custom.txt:
  custom: true

first_party:
  - google
  - apple
  - uber
  - tiktok
  - bytedance

# Titles that aren't obviously AI/ML but often are ("Software Engineer, AI Platform").
# For these the scanner reads the job description and keeps the job only if it
# mentions at least `generic_title_min_ai_concepts` distinct AI/ML skills
# (LLMs, RAG, agents, LangChain, vector DBs, PyTorch, MLOps, ...).
title_generic:
  - '\bengineer\b'
  - '\bdeveloper\b'
generic_title_min_ai_concepts: 4
max_generic_title_checks: 4000

# Network tuning.
concurrency: 60
request_timeout_seconds: 25
library_concurrency: 40
library_timeout_seconds: 180

# Commit results/ to the repo. Set false if your repo is public.
save_results_in_repo: false

# Skills you have that may not appear word-for-word in resume.txt.
extra_skills:
  - airflow
  - step functions
  - glue
  - emr
  - redshift
  - snowflake
  - mlflow model registry
  - claude api
