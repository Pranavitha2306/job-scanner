name: Daily AI/ML job scan

on:
  schedule:
    # Times are UTC, set for Central Standard Time (UTC-6):
    - cron: "30 12 * * *"   # 6:30 AM Central
    - cron: "30 15 * * *"   # 9:30 AM Central
    - cron: "0 20 * * *"    # 2:00 PM Central
    - cron: "0 0 * * *"     # 6:00 PM Central
  workflow_dispatch:
    inputs:
      limit:
        description: "Only N companies per source (blank = all)"
        required: false
        default: ""
      only:
        description: "all = every source, core = the 5 main platforms"
        required: false
        default: "all"

permissions:
  contents: write

concurrency:
  group: job-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scan career sites
        env:
          RESUME_TEXT: ${{ secrets.RESUME_TEXT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ONLY="${{ github.event.inputs.only }}"
          if [ -z "$ONLY" ]; then
            ONLY=all
          fi
          ARGS="--only $ONLY"
          if [ -n "${{ github.event.inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"; fi
          python -m jobscan.scanner $ARGS

      - name: Save seen-jobs state (and results, if enabled)
        if: always()
        run: |
          git config user.name "job-scan-bot"
          git config user.email "job-scan-bot@users.noreply.github.com"
          git add state
          [ -d results ] && git add results || true
          git diff --cached --quiet || git commit -m "Job scan $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase --autostash || true
          git push
